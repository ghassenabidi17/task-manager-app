openapi: 3.1.0
info:
  title: Task Manager App API
  description: REST API for managing tasks
  version: 0.0.1

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /api/tasks/by-status/{status}:
    get:
      summary: Get tasks filtered by status
      description: Returns all tasks matching the given status
      operationId: getTasksByStatus
      parameters:
        - name: status
          in: path
          required: true
          description: The task status to filter by
          schema:
            type: string
            enum:
              - TODO
              - IN_PROGRESS
              - DONE
      responses:
        '200':
          description: List of tasks with the given status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '401':
          description: Unauthorized - JWT token required

components:
  schemas:
    Task:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: 'Fix login bug'
        description:
          type: string
          example: "Users can't log in with special characters"
        status:
          type: string
          enum:
            - TODO
            - IN_PROGRESS
            - DONE
        dueDate:
          type: string
          format: date
          example: '2026-02-20'
        priority:
          type: integer
          minimum: 1
          maximum: 5
          example: 3
